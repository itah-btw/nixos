# Umbriel configuration for host "umbriel".
#
# Managed by home-manager (xdg.configFile), so this file is a read-only
# symlink into the Nix store: edit it in the repo and run
#   sudo nixos-rebuild switch --flake ~/nixos#nixos
# instead of editing ~/.config/umbriel/config.toml directly.
#
# Reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# General

[general]
# Noctalia is started by the systemd user service (programs.noctalia.systemd),
# so it is deliberately NOT listed under autostart to avoid launching twice.
autostart = []
xwayland = true

# ==============================================================================
# Includes
# Noctalia writes its theme colors to ~/.config/umbriel/noctalia.toml at
# runtime; include it so borders/title bars follow the shell theme.
[include]
files = []

[include.optional]
files = ["/home/itah/.config/umbriel/noctalia.toml"]

# ==============================================================================
# General
# Values recommended by Noctalia's Umbriel integration guide.

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 0

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# ==============================================================================
# Input

[input.keyboard]
numlock_toggle = true
repeat_rate = 35
repeat_delay = 200

[input.touchpad]
natural_scroll = true

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind is
# listed here.
# Syntax:  https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications, shell and session
"Mod+Return" = { action = "spawn:kitty", repeat = false }
"Mod+B" = { action = "spawn:brave-origin", repeat = false }
"Mod+E" = { action = "spawn:kitty -e yazi", repeat = false }
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+S" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+Shift+S" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Alt+Tab" = "spawn:noctalia msg window-switcher hold"
# Screenshots go through Umbriel's wlr-screencopy path; the per-call flags
# force a save + clipboard copy regardless of [shell.screenshot] defaults.
"Print" = { action = "spawn:noctalia msg screenshot-region --save-to-file --copy-to-clipboard", repeat = false }
"Shift+Print" = { action = "spawn:noctalia msg screenshot-fullscreen --save-to-file --copy-to-clipboard", repeat = false }
"Ctrl+Print" = { action = "spawn:noctalia msg screenshot-window --save-to-file --copy-to-clipboard", repeat = false }
"Mod+Shift+A" = { action = "spawn:noctalia msg screenshot-annotate --save-to-file --copy-to-clipboard", repeat = false }
"Mod+Shift+O" = { action = "spawn:ocr-region", repeat = false }
"Mod+Ctrl+A" = { action = "spawn:noctalia msg annotate", repeat = false }
"Mod+Shift+L" = { action = "spawn:noctalia msg session lock", repeat = false }
"Mod+Shift+XF86Assistant" = { action = "spawn:kitty -e opencode /home/itah/Projects", repeat = false }

# Wallpaper
"Mod+Shift+W" = { action = "spawn:noctalia msg wallpaper-next", repeat = false }
"Mod+Ctrl+W" = { action = "spawn:noctalia msg wallpaper-previous", repeat = false }
"Mod+Alt+W" = { action = "spawn:noctalia msg wallpaper-random", repeat = false }
"Mod+Alt+P" = { action = "spawn:noctalia msg panel-toggle wallpaper", repeat = false }

# Wallhaven (plugin)
"Mod+Alt+H" = { action = "spawn:noctalia msg panel-toggle noctalia/wallhaven:browser", repeat = false }

# Clipboard
"Mod+V" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Shift+V" = { action = "spawn:noctalia msg clipboard-clear", repeat = false }

# Notifications
"Mod+N" = { action = "spawn:noctalia msg notification-dnd-toggle", repeat = false }
"Mod+Shift+N" = { action = "spawn:noctalia msg notification-clear-active", repeat = false }
"Mod+Alt+Shift+N" = { action = "spawn:noctalia msg notification-invoke-latest", repeat = false }
"Mod+Alt+Shift+H" = { action = "spawn:noctalia msg notification-clear-history", repeat = false }

# Network / bluetooth
"Mod+I" = { action = "spawn:noctalia msg wifi-toggle", repeat = false }
"Mod+Shift+I" = { action = "spawn:noctalia msg network-toggle", repeat = false }
"Mod+Shift+B" = { action = "spawn:noctalia msg bluetooth-toggle", repeat = false }

# Power profile
"Mod+Shift+P" = { action = "spawn:noctalia msg power-cycle", repeat = false }

# Control Center tabs
"Mod+Alt+A" = { action = "spawn:noctalia msg panel-toggle control-center audio", repeat = false }
"Mod+Alt+M" = { action = "spawn:noctalia msg panel-toggle control-center media", repeat = false }
"Mod+Alt+N" = { action = "spawn:noctalia msg panel-toggle control-center notifications", repeat = false }
"Mod+Alt+S" = { action = "spawn:noctalia msg panel-toggle control-center system", repeat = false }
"Mod+Alt+C" = { action = "spawn:noctalia msg panel-toggle control-center calendar", repeat = false }
# Emoji picker through the launcher's /emo provider.
"Mod+Alt+Period" = { action = "spawn:noctalia msg panel-toggle launcher /emo", repeat = false }
# Calculator provider.
"Mod+Alt+Shift+C" = { action = "spawn:noctalia msg panel-toggle launcher /calc", repeat = false }

# System toggles (Noctalia)
"Mod+Ctrl+C" = { action = "spawn:noctalia msg caffeine-toggle", repeat = false }
"Mod+Ctrl+N" = { action = "spawn:noctalia msg nightlight-toggle", repeat = false }
"Mod+Ctrl+Shift+N" = { action = "spawn:noctalia msg nightlight-force-toggle", repeat = false }
"Mod+Ctrl+T" = { action = "spawn:noctalia msg theme-mode-toggle", repeat = false }
"Mod+Ctrl+D" = { action = "spawn:noctalia msg dock-toggle", repeat = false }
"Mod+Ctrl+Shift+B" = { action = "spawn:noctalia msg bar-toggle", repeat = false }
"Mod+Ctrl+M" = { action = "spawn:noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"Mod+Alt+D" = { action = "spawn:noctalia msg desktop-widgets-toggle", repeat = false }
"Mod+Alt+Shift+D" = { action = "spawn:noctalia msg desktop-widgets-toggle-edit", repeat = false }

# Session menu
"Mod+X" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }

# Media, volume and brightness, routed through Noctalia so its OSDs show.
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
# Some laptops (ThinkPads, etc.) send XF86AudioMicMute or XF86MicrophoneMute.
"XF86AudioMicMute" = { action = "spawn:noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioStop" = { action = "spawn:noctalia msg media stop", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"Mod+Shift+M" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
# Switch between MPRIS players when several are running.
"Mod+Alt+Shift+Left" = { action = "spawn:noctalia msg media previous-player", allow_when_locked = true }
"Mod+Alt+Shift+Right" = { action = "spawn:noctalia msg media next-player", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# Keyboard backlight, when the hardware exposes one.
"XF86KbdBrightnessUp" = { action = "spawn:noctalia msg keyboard-backlight-up", allow_when_locked = true }
"XF86KbdBrightnessDown" = { action = "spawn:noctalia msg keyboard-backlight-down", allow_when_locked = true }
"XF86KbdLightOnOff" = { action = "spawn:noctalia msg keyboard-backlight-toggle", allow_when_locked = true, repeat = false }

# Sleep and power.
"XF86Sleep" = { action = "spawn:noctalia msg session lock-and-suspend", allow_when_locked = true, repeat = false }
"XF86PowerOff" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Shift+F1" = "window-focus-previous"
"Mod+Home" = { action = "column-focus-first", repeat = false }
"Mod+End" = { action = "column-focus-last", repeat = false }
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
# At the workspace edge, continue onto the next output instead.
"Mod+Ctrl+Left" = "window-focus-or-output-left"
"Mod+Ctrl+Down" = "window-focus-or-output-down"
"Mod+Ctrl+Up" = "window-focus-or-output-up"
"Mod+Ctrl+Right" = "window-focus-or-output-right"
# Vim-style mirrors of the output-edge focus binds.
"Mod+Ctrl+H" = "window-focus-or-output-left"
"Mod+Ctrl+J" = "window-focus-or-output-down"
"Mod+Ctrl+K" = "window-focus-or-output-up"
"Mod+Ctrl+L" = "window-focus-or-output-right"
# Jump back to the previous window or workspace.
"Mod+Ctrl+Tab" = { action = "window-focus-last", repeat = false }
"Mod+Ctrl+Shift+Tab" = { action = "workspace-focus-last", repeat = false }
# Vim-style move, mirroring Mod+Shift+arrows.
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
# Consume when the focused window is alone in its column, expel when it is not.
"Mod+Comma" = "window-consume-or-expel-left"
"Mod+Period" = "window-consume-or-expel-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Ctrl+Shift+W" = { action = "column-toggle-tab-bar", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+Ctrl+Alt+Left" = "column-move-tab-previous"
"Mod+Ctrl+Alt+Right" = "column-move-tab-next"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "column-move-left"
"Mod+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Alt+Space" = "workspace-set-layout:toggle"
"Mod+Shift+F" = { action = "workspace-set-layout:toggle", repeat = false }
"Mod+Alt+J" = "layout-master-count-increase"
"Mod+Alt+K" = "layout-master-count-decrease"
# Center the focused column, or the focused floating window.
"Mod+C" = { action = "column-center", repeat = false }
"Mod+Shift+C" = { action = "window-center", repeat = false }
# Resize the focused column/area: primary extent is width, secondary is height.
"Mod+Ctrl+Shift+Left" = "window-modify-primary-extent:-0.05"
"Mod+Ctrl+Shift+Right" = "window-modify-primary-extent:0.05"
"Mod+Ctrl+Shift+Up" = "window-modify-secondary-extent:-0.05"
"Mod+Ctrl+Shift+Down" = "window-modify-secondary-extent:0.05"

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
# Step through workspaces without knowing their number.
"Mod+BracketLeft" = "workspace-previous"
"Mod+BracketRight" = "workspace-next"
"Mod+Shift+BracketLeft" = "window-move-to-workspace-previous"
"Mod+Shift+BracketRight" = "window-move-to-workspace-next"

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"
"Mod+Shift+Tab" = "scratchpad-window-show-previous"

# ==============================================================================
# Layout

[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Window rules

# Blur windows using the non-optimized path so translucent windows include
# overlapping windows behind them.
[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Layer rules and blur for Noctalia's own surfaces

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.6
blur_popups = true
blur_optimized = false

# ==============================================================================
# Hot corners

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
